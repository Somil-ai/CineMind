name: ci
on: [push, pull_request]
jobs:
  reco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r services/reco/requirements.txt httpx
      - run: PYTHONPATH=. pytest -q
        working-directory: services/reco
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: {POSTGRES_PASSWORD: test, POSTGRES_DB: cinemind_test}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "20", cache: npm, cache-dependency-path: services/api/package-lock.json}
      - run: PGPASSWORD=test psql -h localhost -U postgres -d cinemind_test -v ON_ERROR_STOP=1 -f db/schema.sql
      - run: npm ci && npx tsc --noEmit && npm test
        working-directory: services/api
        env: {TEST_DATABASE_URL: "postgresql://postgres:test@localhost:5432/cinemind_test"}
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "20", cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: npm ci && npx tsc --noEmit && npm test && npm run build
        working-directory: apps/web
