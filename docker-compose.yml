services:
  db:    {image: pgvector/pgvector:pg16, environment: {POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}", POSTGRES_DB: cinemind}, volumes: ["./db/schema.sql:/docker-entrypoint-initdb.d/01.sql", "pg:/var/lib/postgresql/data"], ports: ["5432:5432"]}
  redis: {image: redis:7-alpine, ports: ["6379:6379"]}
  reco:  {build: {context: ./services/reco}, env_file: .env, ports: ["8001:8001"]}
  api:   {build: {context: ./services/api}, env_file: .env, environment: {RECO_URL: "http://reco:8001", PORT: "4000"}, depends_on: [reco], ports: ["4000:4000"]}
  web:   {build: {context: ./apps/web, args: {NEXT_PUBLIC_API_URL: "http://localhost:4000/v1"}}, environment: {API_URL: "http://api:4000/v1"}, depends_on: [api], ports: ["3000:3000"]}
volumes: {pg: {}}
